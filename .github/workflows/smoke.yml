name: Smoke

# Daily probe of the deployed worker — same check as the deploy.yml step,
# catching breakage that lands between deploys (Access drift, index rot,
# D1 issues). Red run = owner notification; no auto-rollback. See the Smoke
# tier in docs/TESTING.md.

on:
  schedule:
    - cron: "0 2 * * *" # ~10:00 HKT
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke check prod
        working-directory: packages/mcp-worker
        run: pnpm smoke https://cardex.brandonhk.com
