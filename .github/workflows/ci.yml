name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Branch + commit conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Head branch is type/slug
        run: |
          branch='${{ github.head_ref }}'
          # Long-lived integration branches legitimately head promotion and
          # backmerge PRs (dev -> main, main -> dev); they are not type/slug.
          if printf '%s' "$branch" | grep -qxE 'dev|develop|main|master'; then
            exit 0
          fi
          # Dependabot branches are not type/slug either — dependabot.yml has
          # no branchPrefix option, so the bot gets a path-based exemption.
          if printf '%s' "$branch" | grep -qE '^dependabot/'; then
            exit 0
          fi
          if ! printf '%s' "$branch" | grep -qE '^(feat|feature|bugfix|fix|hotfix|release|chore)/[a-z0-9]+([.-][a-z0-9]+)*$'; then
            echo "::error::branch '$branch' must match type/slug per Conventional Branch —"
            echo "(feat|feature|bugfix|fix|hotfix|release|chore)/lowercase-hyphen-slug"
            exit 1
          fi
      - name: PR title is a Conventional Commit subject, ASCII-only
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -qE '^(feat|fix|refactor|docs|chore|test|ci|perf)\([a-z0-9._/-]+\)!?: [a-z0-9].{0,70}$'; then
            echo "::error::PR title must match type(scope): summary, <=72 chars"
            exit 1
          fi
          if printf '%s' "$PR_TITLE" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error::PR title must be ASCII-only (CJK/emoji goes in the body)"
            exit 1
          fi
          echo "PR title ok"
      - name: Commit subjects are Conventional Commits, ASCII-only
        run: |
          bad=0
          while IFS= read -r subj; do
            if ! printf '%s' "$subj" | grep -qE '^(feat|fix|refactor|docs|chore|test|ci|perf)\([a-z0-9._/-]+\)!?: [a-z0-9].{0,70}$'; then
              echo "::error::non-conventional subject (want type(scope): summary, <=72 chars): $subj"
              bad=1
            fi
            if printf '%s' "$subj" | LC_ALL=C grep -q '[^ -~]'; then
              echo "::error::non-ASCII subject (CJK/emoji — put it in the body instead): $subj"
              bad=1
            fi
          done < <(git log --no-merges --format='%s' '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}')
          if [ "$bad" -eq 0 ]; then echo "commit subjects ok"; fi
          exit "$bad"

  contract:
    name: Contract gate (code ↔ PRD ↔ spec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: contract-exempt label skips the gate
        if: contains(github.event.pull_request.labels.*.name, 'contract-exempt')
        run: echo "skipped via contract-exempt label"
      - name: Check drift both ways
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'contract-exempt') }}
        run: node scripts/contract-gate.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a secret committed three commits back still leaks
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: eslint complexity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          # Astro's floor is Node 22.23.4; "22" can resolve to an older
          # cached 22.x and fail astro check before it builds.
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: vitest + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          # Astro's floor is Node 22.23.4; "22" can resolve to an older
          # cached 22.x and fail astro check before it builds.
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Worker's assets directory is packages/site/dist (ADR 0004); the
      # vitest pool and wrangler both read it, so build the site first.
      - name: Build site (astro check + build)
        run: pnpm build:site
      # seed/seed.sql is generated by the scheduled export — make sure the
      # snapshot actually loads into a fresh local D1 before specs run.
      - name: seed.sql loads into a fresh local D1
        run: pnpm migrate && pnpm seed
      - run: pnpm test
      - run: pnpm --dir packages/mcp-worker typecheck
