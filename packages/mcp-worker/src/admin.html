<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardex Admin — Proposals</title>
<style>
  :root {
    --bg: hsl(222, 42%, 8%);
    --surface: hsl(220, 30%, 13%);
    --border: hsl(218, 20%, 25%);
    --border-soft: hsl(218, 18%, 20%);
    --text: hsl(214, 32%, 92%);
    --text-dim: hsl(216, 15%, 64%);
    --text-faint: hsl(216, 12%, 46%);
    --accent: hsl(210, 65%, 66%);
    --accent-bg: hsl(215, 40%, 22%);
    --success: hsl(150, 45%, 60%);
    --success-bg: hsl(150, 38%, 15%);
    --danger: hsl(6, 62%, 66%);
    --danger-bg: hsl(6, 42%, 18%);
    --pending: hsl(38, 58%, 60%);
    --pending-bg: hsl(40, 38%, 17%);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
  }
  #root { min-height: 100vh; display: flex; flex-direction: column; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 20px;
    min-height: 56px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .tabs { display: flex; gap: 4px; flex: 1; }
  .tab {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab:hover { background: var(--border-soft); }
  .tab.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .tab .badge {
    background: var(--pending-bg);
    color: var(--pending);
    border-radius: 10px;
    font-size: 11px;
    padding: 1px 7px;
    font-weight: 600;
  }
  .who {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    min-width: 0;
  }
  .who > span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .who .access {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--success);
    border: 1px solid var(--success);
    border-radius: 10px;
    padding: 1px 7px;
    letter-spacing: 0.3px;
  }

  .main { flex: 1; padding: 24px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .page-title { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .page-sub { font-size: 13px; color: var(--text-dim); margin: 0 0 20px; }

  .table-scroll {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  table.list {
    width: 100%;
    min-width: 620px;
    border-collapse: collapse;
  }
  .table-scroll.wide table.list { min-width: 780px; }
  table.list th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-faint);
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    white-space: nowrap;
  }
  table.list td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 13px;
    vertical-align: top;
  }
  table.list tr:last-child td { border-bottom: none; }
  table.list tbody tr.clickable { cursor: pointer; }
  table.list tbody tr.clickable:hover { background: var(--accent-bg); }
  .dim-row { opacity: 0.55; }

  .chip {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .chip.pending { background: var(--pending-bg); color: var(--pending); }
  .chip.applied, .chip.approved { background: var(--success-bg); color: var(--success); }
  .chip.rejected { background: var(--danger-bg); color: var(--danger); }
  .chip.op-insert { background: var(--success-bg); color: var(--success); }
  .chip.op-update { background: var(--pending-bg); color: var(--pending); }
  .chip.op-delete { background: var(--danger-bg); color: var(--danger); }

  .mono { font-family: var(--mono); font-size: 12px; }
  .target { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .muted { color: var(--text-dim); }
  .faint { color: var(--text-faint); font-size: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .card h3 {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-faint);
  }
  .back-link {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    margin-bottom: 12px;
  }
  .back-link:hover { text-decoration: underline; }

  .evidence blockquote {
    margin: 0 0 8px;
    padding: 10px 14px;
    border-left: 3px solid var(--accent);
    background: var(--bg);
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    border-radius: 0 6px 6px 0;
  }
  .evidence a { font-family: var(--mono); font-size: 12px; color: var(--accent); word-break: break-all; }

  .patch { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
  .patch-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 10px;
    padding: 8px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border-soft);
  }
  .patch-head .target { overflow-wrap: anywhere; }
  .patch-rows { padding: 4px 0; }
  .diff-row {
    display: grid;
    grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) 24px minmax(0, 1fr);
    align-items: center;
    padding: 5px 12px;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .diff-row .field { color: var(--text-dim); }
  .diff-row .old { background: var(--danger-bg); color: var(--danger); border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; }
  .diff-row .new { background: var(--success-bg); color: var(--success); border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; }
  .diff-row .arrow { color: var(--text-faint); text-align: center; }
  .diff-row .ins { background: var(--success-bg); color: var(--success); border-radius: 4px; padding: 1px 6px; grid-column: 2 / 5; overflow-wrap: anywhere; }
  .diff-row .del { background: var(--danger-bg); color: var(--danger); border-radius: 4px; padding: 1px 6px; grid-column: 2 / 5; overflow-wrap: anywhere; text-decoration: line-through; }

  .actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .actions input[type="text"] {
    flex: 1 1 220px;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }
  .btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.approve { background: var(--success); border-color: var(--success); color: hsl(150, 45%, 10%); }
  .btn.approve:hover:not(:disabled) { background: hsl(150, 45%, 52%); }
  .btn.reject { color: var(--danger); border-color: var(--danger); }
  .btn.reject:hover:not(:disabled) { background: var(--danger-bg); }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 10, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal {
    background: var(--surface);
    border-radius: 10px;
    padding: 24px;
    width: 440px;
    max-width: 100%;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
  }
  .modal h3 { margin: 0 0 8px; font-size: 16px; }
  .modal p { font-size: 13px; color: var(--text-dim); margin: 0 0 14px; }
  .modal .pin-row { margin: 0 0 16px; }
  .modal .pin-row label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .modal .pin-row input {
    width: 140px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 4px;
    background: var(--surface);
    color: var(--text);
  }
  .modal .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    max-width: calc(100vw - 32px);
  }
  .empty {
    padding: 48px;
    text-align: center;
    color: var(--text-faint);
    font-size: 13px;
  }

  @media (max-width: 640px) {
    .topbar { padding: 8px 12px; gap: 8px 12px; }
    .tab { padding: 6px 10px; }
    .main { padding: 16px 12px; }
    .card { padding: 14px; }
    .empty { padding: 32px 16px; }
    .diff-row { grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); }
    .diff-row .field { grid-column: 1 / -1; }
    .diff-row .ins, .diff-row .del { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const state = {
  me: "",
  pinRequired: false,
  tab: "queue",
  queue: [],
  decided: [],
  reports: [],
  detail: null,
  detailBusy: false,
  confirm: null,
};

const $root = document.getElementById("root");
const esc = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, opts) {
  const res = await fetch("/admin/api" + path, opts
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(opts) }
    : undefined);
  return res.json();
}

function fmtAge(iso) {
  if (!iso) return "—";
  const h = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 3600000));
  if (h < 1) return "just now";
  if (h < 24) return h + "h ago";
  return Math.round(h / 24) + "d ago";
}

function fmtTs(iso) {
  if (!iso) return "—";
  return iso.slice(0, 16).replace("T", " ") + "Z";
}

function chip(status) {
  return '<span class="chip ' + esc(status) + '">' + esc(status) + "</span>";
}

async function refresh() {
  const me = await api("/me");
  state.me = me.email || "?";
  state.pinRequired = !!me.pin_required;
  const [queue, decided, reports] = await Promise.all([
    api("/proposals?status=pending"),
    api("/proposals?status=applied"),
    api("/reports"),
  ]);
  const rejected = await api("/proposals?status=rejected");
  state.queue = queue.proposals || [];
  state.decided = [...(decided.proposals || []), ...(rejected.proposals || [])]
    .sort((a, b) => (b.decided_at || "").localeCompare(a.decided_at || ""));
  state.reports = reports.reports || [];
  render();
}

async function openDetail(id) {
  state.detailBusy = true;
  state.detail = null;
  render();
  const res = await api("/proposals/" + encodeURIComponent(id));
  state.detailBusy = false;
  state.detail = res.ok ? res.proposal : null;
  render();
}

function toast(msg) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function decide(decision, note, pin) {
  const id = state.detail.id;
  const res = await api("/proposals/" + encodeURIComponent(id) + "/decide",
    { decision, note, pin });
  if (!res.ok) {
    toast("Failed: " + (res.detail || res.error || "unknown"));
    return;
  }
  state.confirm = null;
  toast(decision === "approve" ? "Applied — patches written to facts" : "Rejected");
  state.detail = null;
  await refresh();
}

function proposalRow(p, decided) {
  return '<tr class="clickable" data-id="' + esc(p.id) + '">' +
    "<td><div style=\"font-weight:500\">" + esc(p.summary) + "</div>" +
    '<div class="faint mono">' + esc(p.id) + " · by " + esc(p.proposed_by) + "</div></td>" +
    '<td class="mono" style="text-align:right">' + esc(p.patch_count) + " op" + (p.patch_count === 1 ? "" : "s") + "</td>" +
    '<td class="mono"><a href="' + esc(p.evidence_url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">link ↗</a></td>' +
    '<td class="mono muted">' + esc(decided ? fmtTs(p.decided_at) : fmtAge(p.created_at)) + "</td>" +
    "<td>" + chip(p.status) + (p.decision_note ? '<div class="faint" style="margin-top:4px">' + esc(p.decision_note) + "</div>" : "") + "</td>" +
    "</tr>";
}

function listTable(rows, decided) {
  if (!rows.length) return '<div class="empty">Nothing here.</div>';
  return '<div class="table-scroll"><table class="list"><thead><tr>' +
    "<th>Proposal</th><th style=\"text-align:right\">Patches</th><th>Evidence</th><th>" +
    (decided ? "Decided" : "Proposed") + "</th><th>Status</th>" +
    "</tr></thead><tbody>" + rows.map((p) => proposalRow(p, decided)).join("") +
    "</tbody></table></div>";
}

function reportsTable() {
  if (!state.reports.length) return '<div class="empty">No reports in quarantine.</div>';
  return '<div class="table-scroll wide"><table class="list"><thead><tr>' +
    "<th>Target</th><th>Field</th><th>Claimed</th><th>Evidence</th><th>Note</th><th>Reported</th>" +
    "</tr></thead><tbody>" +
    state.reports.map((r) =>
      "<tr" + (r.evidence_url ? "" : ' class="dim-row"') + ">" +
      '<td class="mono">' + esc(r.target_kind) + ":" + esc(r.target_id) + "</td>" +
      '<td class="mono">' + esc(r.field) + "</td>" +
      '<td class="mono">' + esc(r.claimed_value) + "</td>" +
      '<td class="mono">' + (r.evidence_url ? '<a href="' + esc(r.evidence_url) + '" target="_blank" rel="noopener">link ↗</a>' : "—") + "</td>" +
      '<td class="muted">' + esc(r.note || "—") + "</td>" +
      '<td class="mono muted">' + esc(fmtTs(r.reported_at)) + "</td>" +
      "</tr>").join("") +
    "</tbody></table></div>";
}

function diffRow(field, oldV, newV) {
  return '<div class="diff-row"><span class="field">' + esc(field) + "</span>" +
    '<span class="old">' + esc(oldV === undefined ? "—" : JSON.stringify(oldV)) + "</span>" +
    '<span class="arrow">→</span>' +
    '<span class="new">' + esc(JSON.stringify(newV)) + "</span></div>";
}

function patchCard(patch) {
  const rows = [];
  if (patch.op === "insert") {
    const set = patch.set || {};
    const clash = patch.old || null;
    if (clash) {
      rows.push('<div class="diff-row"><span class="del">row already exists — insert will fail on apply</span></div>');
    }
    for (const k of Object.keys(set)) {
      rows.push(clash
        ? diffRow(k, clash[k], set[k])
        : '<div class="diff-row"><span class="field">' + esc(k) + '</span><span class="ins">+ ' + esc(JSON.stringify(set[k])) + "</span></div>");
    }
  } else if (patch.op === "update") {
    const old = patch.old || {};
    for (const k of Object.keys(patch.set || {})) {
      rows.push(diffRow(k, old[k], patch.set[k]));
    }
  } else if (patch.op === "delete") {
    const old = patch.old || {};
    for (const k of Object.keys(old)) {
      rows.push('<div class="diff-row"><span class="field">' + esc(k) + '</span><span class="del">' + esc(JSON.stringify(old[k])) + "</span></div>");
    }
    if (!Object.keys(old).length) {
      rows.push('<div class="diff-row"><span class="del">row not found — nothing to delete</span></div>');
    }
  }
  return '<div class="patch"><div class="patch-head">' +
    '<span class="chip op-' + esc(patch.op) + '">' + esc(patch.op).toUpperCase() + "</span>" +
    '<span class="mono">' + esc(patch.table) + "</span>" +
    '<span class="target">' + esc(patch.id) + "</span></div>" +
    '<div class="patch-rows">' + rows.join("") + "</div></div>";
}

function detailView() {
  if (state.detailBusy) return '<div class="empty">Loading…</div>';
  const p = state.detail;
  if (!p) return '<div class="empty">Proposal not found.</div>';
  const pending = p.status === "pending";
  return (
    '<button class="back-link" data-back>← Back to queue</button>' +
    '<div class="card"><div class="faint mono" style="margin-bottom:6px">' +
    esc(p.id) + " " + chip(p.status) + " by " + esc(p.proposed_by) + " · " + esc(fmtAge(p.created_at)) + "</div>" +
    '<div class="page-title" style="font-size:16px">' + esc(p.summary) + "</div>" +
    (p.decided_by ? '<p class="muted" style="margin:10px 0 0">Decided by ' + esc(p.decided_by) + " at " + esc(fmtTs(p.decided_at)) +
      (p.decision_note ? " — " + esc(p.decision_note) : "") + "</p>" : "") +
    "</div>" +
    '<div class="card evidence"><h3>Evidence</h3>' +
    (p.excerpt ? "<blockquote>" + esc(p.excerpt) + "</blockquote>" : "") +
    '<a href="' + esc(p.evidence_url) + '" target="_blank" rel="noopener">' + esc(p.evidence_url) + "</a></div>" +
    '<div class="card"><h3>Patches — ' + esc(p.patches.length) + " op" + (p.patches.length === 1 ? "" : "s") + "</h3>" +
    p.patches.map(patchCard).join("") + "</div>" +
    (pending
      ? '<div class="card"><h3>Decision</h3><div class="actions">' +
        '<input type="text" id="note" placeholder="Decision note (required to reject)">' +
        '<button class="btn reject" id="reject">Reject</button>' +
        '<button class="btn approve" id="approve">Approve &amp; apply</button></div></div>'
      : "")
  );
}

function render() {
  const badges = { queue: state.queue.length, history: state.decided.length, reports: state.reports.length };
  let body = "";
  if (state.detail !== null || state.detailBusy) {
    body = detailView();
  } else if (state.tab === "queue") {
    body = '<h2 class="page-title">Pending proposals</h2>' +
      '<p class="page-sub">Submitted via /maintainer — approve applies the patches to D1 in one transaction.</p>' +
      listTable(state.queue, false);
  } else if (state.tab === "history") {
    body = '<h2 class="page-title">Decision history</h2>' +
      '<p class="page-sub">Audit trail — who proposed, what changed, who decided.</p>' +
      listTable(state.decided, true);
  } else {
    body = '<h2 class="page-title">Quarantined reports</h2>' +
      '<p class="page-sub">Public submissions via report_issue — triage leads for the maintenance agent.</p>' +
      reportsTable();
  }

  $root.innerHTML =
    '<div class="topbar"><div class="brand"><span class="dot"></span>Cardex Admin</div>' +
    '<div class="tabs">' +
    '<button class="tab' + (state.tab === "queue" && !state.detail && !state.detailBusy ? " active" : "") + '" data-tab="queue">Queue <span class="badge">' + badges.queue + "</span></button>" +
    '<button class="tab' + (state.tab === "history" ? " active" : "") + '" data-tab="history">History</button>' +
    '<button class="tab' + (state.tab === "reports" ? " active" : "") + '" data-tab="reports">Reports</button></div>' +
    '<div class="who"><span class="access">ACCESS</span><span>' + esc(state.me) + "</span></div></div>" +
    '<div class="main">' + body + "</div>" +
    (state.confirm
      ? '<div class="modal-backdrop"><div class="modal"><h3>Apply ' + esc(state.confirm.patches) + " patch" + (state.confirm.patches === 1 ? "" : "es") + "?</h3>" +
        "<p>This writes to the facts tables in one transaction and marks " + esc(state.confirm.id) + " applied.</p>" +
        (state.pinRequired
          ? '<div class="pin-row"><label>Approval PIN</label><input id="pin" type="password" autocomplete="off"></div>'
          : "") +
        '<div class="modal-btns"><button class="btn" id="cancel">Cancel</button>' +
        '<button class="btn approve" id="confirm">Confirm apply</button></div></div></div>'
      : "");

  document.querySelectorAll("[data-tab]").forEach((b) =>
    b.addEventListener("click", () => { state.tab = b.dataset.tab; state.detail = null; render(); }));
  document.querySelectorAll("tr.clickable").forEach((tr) =>
    tr.addEventListener("click", () => openDetail(tr.dataset.id)));
  const back = document.querySelector("[data-back]");
  if (back) back.addEventListener("click", () => { state.detail = null; render(); });

  const approve = document.getElementById("approve");
  if (approve) approve.addEventListener("click", () => {
    state.confirm = { id: state.detail.id, patches: state.detail.patches.length };
    render();
  });
  const reject = document.getElementById("reject");
  if (reject) reject.addEventListener("click", () => {
    const note = document.getElementById("note").value.trim();
    if (!note) { toast("Reject needs a decision note"); return; }
    decide("reject", note);
  });
  const cancel = document.getElementById("cancel");
  if (cancel) cancel.addEventListener("click", () => { state.confirm = null; render(); });
  const confirm = document.getElementById("confirm");
  if (confirm) confirm.addEventListener("click", () => {
    const note = document.getElementById("note") ? document.getElementById("note").value.trim() : "";
    const pinEl = document.getElementById("pin");
    decide("approve", note || undefined, pinEl ? pinEl.value : undefined);
  });
  if (state.confirm) {
    (document.getElementById("pin") || document.getElementById("confirm")).focus();
  }
}

document.addEventListener("keydown", (e) => {
  if (!state.confirm) return;
  if (e.key === "Escape") { state.confirm = null; render(); }
  if (e.key === "Enter" && document.activeElement && document.activeElement.id === "pin") {
    document.getElementById("confirm").click();
  }
});

refresh().catch((e) => { $root.innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + "</div>"; });
</script>
</body>
</html>
